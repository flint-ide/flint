name: Release

# A tag vX.Y.Z builds a universal Flint.app, packs it as .zip and .dmg with
# SHA-256 checksums and build provenance, and drafts a GitHub release.
# Signing and notarization run only when the Apple secrets are configured;
# otherwise the app is ad-hoc signed (users open it with right-click → Open).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no cache poisoning across releases

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install tools and dependencies
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          (cd frontend && npm ci --ignore-scripts)

      - name: Test
        run: |
          (cd frontend && go run ../cmd/webbuild --test)
          go test ./...

      - name: Build universal app
        env:
          VERSION: ${{ github.ref_name }}
        run: wails3 task package:universal VERSION="$VERSION"

      - name: Sign and notarize
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" build/bin/flint.app
          ditto -c -k --keepParent build/bin/flint.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/bin/flint.app

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/flint.app "dist/Flint-$VERSION-macos-universal.zip"
          hdiutil create -volname Flint -srcfolder build/bin/flint.app -ov -format UDZO "dist/Flint-$VERSION-macos-universal.dmg"
          (cd dist && shasum -a 256 -- ./Flint-* > SHA256SUMS.txt)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Flint-*

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --draft --verify-tag --generate-notes --title "Flint $VERSION"
