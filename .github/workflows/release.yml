name: Release

# Publishes a GitHub release with a universal Flint.app (.zip and .dmg), Linux
# archives (x86_64 and arm64), SHA-256 checksums and build provenance.
#
# A release starts in one of three ways:
# - automatically, when CI passes on a push to main and the Conventional
#   Commits since the last release call for one (feat → minor, fix/perf →
#   patch, `!` or BREAKING CHANGE → major; cmd/nextversion). chore, docs, ci,
#   refactor, test and the like don't release anything;
# - by hand: Actions ▸ Release ▸ Run workflow on main, with bump auto, patch,
#   minor or major;
# - by pushing a tag vX.Y.Z.
#
# Signing and notarization run only when the Apple secrets are configured;
# otherwise the app is ad-hoc signed (users open it with right-click → Open).
# The job "homebrew" then updates the Homebrew cask in the tap, when the
# HOMEBREW_TAP_TOKEN secret is set and the app is notarized. It also runs when
# someone publishes a release by hand (a release created with the workflow's
# own token doesn't start other workflow runs, hence the `needs`).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto works it out from the commits since the last release)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: read

# One release at a time: each works out its version from the tags before it.
concurrency:
  group: release
  cancel-in-progress: false

env:
  WAILS_VERSION: v3.0.0

jobs:
  plan:
    name: Plan the release
    # workflow_run: only a successful CI run of a push to main of this repository
    # (the branch filter alone would also match a fork's pull request from its main).
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      EVENT: ${{ github.event_name }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUMP: ${{ inputs.bump || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # all tags and history, to find the last release
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Work out the version
        id: version
        run: |
          skip() {
            echo "::notice::$1"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          case "$EVENT" in
          push)
            version="$GITHUB_REF_NAME"
            ;;
          workflow_dispatch)
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Run the release workflow on main, not $GITHUB_REF"
              exit 1
            fi
            version="$(go run ./cmd/nextversion -bump "$BUMP")"
            ;;
          workflow_run)
            # A newer commit on main gets its own run, which releases this one too.
            if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
              skip "$SHA is no longer the tip of main; the run for the newer commit releases it."
            fi
            version="$(go run ./cmd/nextversion)"
            ;;
          esac
          if [ -z "$version" ]; then
            skip "No feat, fix, perf or breaking commits since the last release; nothing to release."
          fi
          if ! printf '%s' "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a vX.Y.Z version"
            exit 1
          fi
          if [ "$EVENT" != push ] && git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::The tag $version already exists"
            exit 1
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The release $version already exists"
            exit 1
          fi
          echo "Releasing $version from $SHA" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "release=true"
            echo "version=$version"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  macos:
    name: Build (macOS universal)
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no cache poisoning across releases

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install tools and dependencies
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          (cd frontend && npm ci --ignore-scripts)

      - name: Test
        run: |
          (cd frontend && go run ../cmd/webbuild --test)
          go test ./...

      - name: Build universal app
        run: wails3 task package:universal VERSION="$VERSION"

      - name: Sign and notarize
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" build/bin/flint.app
          ditto -c -k --keepParent build/bin/flint.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/bin/flint.app

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/flint.app "dist/Flint-$VERSION-macos-universal.zip"
          hdiutil create -volname Flint -srcfolder build/bin/flint.app -ov -format UDZO "dist/Flint-$VERSION-macos-universal.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Build (Linux ${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no cache poisoning across releases

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install the GTK 4 and WebKitGTK 6 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev pkg-config

      - name: Install tools and dependencies
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          (cd frontend && npm ci --ignore-scripts)

      - name: Package (tar.gz with the binary, .desktop file and icon)
        run: |
          wails3 task package:linux VERSION="$VERSION"
          mkdir -p dist
          # build/bin/flint-vX.Y.Z-linux-amd64.tar.gz → dist/Flint-vX.Y.Z-linux-amd64.tar.gz
          for f in build/bin/flint-"$VERSION"-linux-*.tar.gz; do
            mv "$f" "dist/Flint-${f#build/bin/flint-}"
          done
          tar -tzf dist/Flint-*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [plan, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
      id-token: write # build provenance
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- ./Flint-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Flint-*

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag already exists; otherwise the release creates it at $SHA.
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            set -- --verify-tag
          else
            set -- --target "$SHA"
          fi
          gh release create "$VERSION" dist/* "$@" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flint $VERSION" \
            --generate-notes \
            --latest
          echo "Published [Flint $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$VERSION)" >> "$GITHUB_STEP_SUMMARY"

  # Renders packaging/homebrew/flint.rb with the version and the zip's SHA-256
  # and pushes it to the tap (repository variable HOMEBREW_TAP, default
  # flint-ide/homebrew-tap) with the HOMEBREW_TAP_TOKEN secret. Without the
  # secret every step is skipped. Only a notarized app (stapled ticket, valid
  # signature) is published: an ad-hoc signed one would be blocked by
  # Gatekeeper after `brew install`.
  homebrew:
    needs: [plan, publish]
    if: >-
      always() &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       needs.publish.result == 'success')
    runs-on: macos-latest # stapler and codesign check the notarization
    timeout-minutes: 15
    permissions:
      contents: read # read the release assets
    env:
      # Only whether the secret exists; the token itself is given to the push step alone.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      TAP: ${{ vars.HOMEBREW_TAP || 'flint-ide/homebrew-tap' }}
      TAG: ${{ github.event.release.tag_name || needs.plan.outputs.version }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ "$HAS_TAP_TOKEN" != "true" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask is not updated."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$TAP" | grep -Eq '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::HOMEBREW_TAP must be owner/repository, not '$TAP'"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$TAG is not a vX.Y.Z release; the Homebrew cask is not updated."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - name: Download and check the release
        id: verify
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Flint-$TAG-macos-universal.zip"
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/app"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" --pattern "$zip" --pattern SHA256SUMS.txt
          (cd "$RUNNER_TEMP/release" && grep -F "./$zip" SHA256SUMS.txt | shasum -a 256 -c -)
          ditto -x -k "$RUNNER_TEMP/release/$zip" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/flint.app"
          if ! codesign --verify --deep --strict "$app" || ! xcrun stapler validate "$app"; then
            echo "::warning::$TAG is not notarized (the Apple signing secrets were not set); the Homebrew cask is not updated."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "notarized=true" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/release/$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Render the cask
        if: steps.verify.outputs.notarized == 'true'
        env:
          SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::bad SHA-256 '$SHA256'"
            exit 1
          fi
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{SHA256}}/$SHA256/g" packaging/homebrew/flint.rb > "$RUNNER_TEMP/flint.rb"
          if grep -q '{{' "$RUNNER_TEMP/flint.rb"; then
            echo "::error::unrendered placeholder in the cask"
            exit 1
          fi
          ruby -c "$RUNNER_TEMP/flint.rb"

      - name: Push the cask to the tap
        if: steps.verify.outputs.notarized == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh auth setup-git
          gh repo clone "$TAP" "$RUNNER_TEMP/tap" -- --depth 1
          cd "$RUNNER_TEMP/tap"
          mkdir -p Casks
          cp "$RUNNER_TEMP/flint.rb" Casks/flint.rb
          if git diff --quiet -- Casks/flint.rb && ! git ls-files --others --exclude-standard | grep -q .; then
            echo "Casks/flint.rb is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/flint.rb
          git commit -m "flint ${TAG#v}"
          git push
