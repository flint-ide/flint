name: Release

# A tag vX.Y.Z builds a universal Flint.app, packs it as .zip and .dmg with
# SHA-256 checksums and build provenance, and drafts a GitHub release.
# Signing and notarization run only when the Apple secrets are configured;
# otherwise the app is ad-hoc signed (users open it with right-click → Open).
# Publishing the drafted release updates the Homebrew cask in the tap (job
# "homebrew"), when the HOMEBREW_TAP_TOKEN secret is set.

on:
  push:
    tags: ["v*.*.*"]
  release:
    types: [published]

permissions:
  contents: read

env:
  WAILS_VERSION: v3.0.0

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no cache poisoning across releases

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install tools and dependencies
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          (cd frontend && npm ci --ignore-scripts)

      - name: Test
        run: |
          (cd frontend && go run ../cmd/webbuild --test)
          go test ./...

      - name: Build universal app
        env:
          VERSION: ${{ github.ref_name }}
        run: wails3 task package:universal VERSION="$VERSION"

      - name: Sign and notarize
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # one keychain path per word
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          codesign --force --deep --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" build/bin/flint.app
          ditto -c -k --keepParent build/bin/flint.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/bin/flint.app

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/bin/flint.app "dist/Flint-$VERSION-macos-universal.zip"
          hdiutil create -volname Flint -srcfolder build/bin/flint.app -ov -format UDZO "dist/Flint-$VERSION-macos-universal.dmg"
          (cd dist && shasum -a 256 -- ./Flint-* > SHA256SUMS.txt)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Flint-*

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --draft --verify-tag --generate-notes --title "Flint $VERSION"

  # Runs when the draft is published (its assets are public only then): renders
  # packaging/homebrew/flint.rb with the version and the zip's SHA-256 and pushes
  # it to the tap (repository variable HOMEBREW_TAP, default ODudek/homebrew-tap)
  # with the HOMEBREW_TAP_TOKEN secret. Without the secret every step is skipped.
  # Only a notarized app (stapled ticket, valid signature) is published: an
  # ad-hoc signed one would be blocked by Gatekeeper after `brew install`.
  homebrew:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: macos-latest # stapler and codesign check the notarization
    timeout-minutes: 15
    permissions:
      contents: read # read the release assets
    env:
      # Only whether the secret exists; the token itself is given to the push step alone.
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      TAP: ${{ vars.HOMEBREW_TAP || 'ODudek/homebrew-tap' }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ "$HAS_TAP_TOKEN" != "true" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask is not updated."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$TAP" | grep -Eq '^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::HOMEBREW_TAP must be owner/repository, not '$TAP'"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::$TAG is not a vX.Y.Z release; the Homebrew cask is not updated."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - name: Download and check the release
        id: verify
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="Flint-$TAG-macos-universal.zip"
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/app"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release" --pattern "$zip" --pattern SHA256SUMS.txt
          (cd "$RUNNER_TEMP/release" && grep -F "./$zip" SHA256SUMS.txt | shasum -a 256 -c -)
          ditto -x -k "$RUNNER_TEMP/release/$zip" "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/flint.app"
          if ! codesign --verify --deep --strict "$app" || ! xcrun stapler validate "$app"; then
            echo "::warning::$TAG is not notarized (the Apple signing secrets were not set); the Homebrew cask is not updated."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "notarized=true" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/release/$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Render the cask
        if: steps.verify.outputs.notarized == 'true'
        env:
          SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$SHA256" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::bad SHA-256 '$SHA256'"
            exit 1
          fi
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{SHA256}}/$SHA256/g" packaging/homebrew/flint.rb > "$RUNNER_TEMP/flint.rb"
          if grep -q '{{' "$RUNNER_TEMP/flint.rb"; then
            echo "::error::unrendered placeholder in the cask"
            exit 1
          fi
          ruby -c "$RUNNER_TEMP/flint.rb"

      - name: Push the cask to the tap
        if: steps.verify.outputs.notarized == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh auth setup-git
          gh repo clone "$TAP" "$RUNNER_TEMP/tap" -- --depth 1
          cd "$RUNNER_TEMP/tap"
          mkdir -p Casks
          cp "$RUNNER_TEMP/flint.rb" Casks/flint.rb
          if git diff --quiet -- Casks/flint.rb && ! git ls-files --others --exclude-standard | grep -q .; then
            echo "Casks/flint.rb is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/flint.rb
          git commit -m "flint ${TAG#v}"
          git push
