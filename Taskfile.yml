# Flint's build (Wails v3, macOS and Linux). Run with `wails3 task <name>`:
#   build          the flint binary in build/bin (for the system it runs on)
#   package        build/bin/flint.app (ad-hoc signed; macOS)
#   package:linux  build/bin/flint-<version>-linux-<arch>.tar.gz (Linux)
#   dev            the app with live reload of Go and the frontend
#   server         the app as an HTTP server for a browser (no window), for UI checks
version: '3'

vars:
  APP_NAME: flint
  BIN_DIR: build/bin
  DEV_PORT: 5173
  # Release builds pass VERSION=vX.Y.Z; it shows in diagnostics and About.
  VERSION: '{{.VERSION | default "dev"}}'
  LDFLAGS: -w -s -X main.version={{.VERSION}}

env:
  CGO_ENABLED: 1
  # macOS builds target macOS 12; elsewhere cgo keeps its defaults (GTK 4 / WebKitGTK 6 on Linux).
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=12.0{{else}}-O2 -g{{end}}'
  CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=12.0{{else}}-O2 -g{{end}}'

tasks:
  bindings:
    summary: Generates the TypeScript bindings of the Go services
    sources: ["*.go", "internal/**/*.go", go.mod]
    generates: ["frontend/bindings/**/*"]
    cmds:
      - wails3 generate bindings -ts -silent -d frontend/bindings ./

  frontend:
    summary: Typechecks and bundles the frontend (cmd/webbuild, no npm scripts)
    deps: [bindings]
    dir: frontend
    cmds:
      - go run ../cmd/webbuild --typecheck

  icons:
    summary: Makes the macOS icon from build/appicon.png
    sources: [build/appicon.png]
    generates: [build/darwin/icons.icns]
    cmds:
      - wails3 generate icons -input build/appicon.png -macfilename build/darwin/icons.icns

  build:
    summary: Builds the production binary
    deps: [frontend]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -tags production -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.APP_NAME}}

  build:universal:
    summary: Builds one binary for Apple silicon and Intel (release builds)
    deps: [frontend]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - GOARCH=arm64 go build -tags production -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.APP_NAME}}-arm64
      - GOARCH=amd64 go build -tags production -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/{{.APP_NAME}}-amd64
      - lipo -create -output {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}-arm64 {{.BIN_DIR}}/{{.APP_NAME}}-amd64
      - rm {{.BIN_DIR}}/{{.APP_NAME}}-arm64 {{.BIN_DIR}}/{{.APP_NAME}}-amd64

  package:
    summary: Bundles build/bin/flint.app
    deps: [build, icons]
    cmds:
      - task: bundle

  package:universal:
    summary: Bundles a universal build/bin/flint.app (releases)
    deps: ["build:universal", icons]
    cmds:
      - task: bundle

  package:linux:
    summary: Packs build/bin/flint-<version>-linux-<arch>.tar.gz (run on Linux)
    deps: [build]
    vars:
      PKG: '{{.BIN_DIR}}/linux-package'
      ID: io.github.odudek.flint
      ARCHIVE: '{{.BIN_DIR}}/{{.APP_NAME}}-{{.VERSION}}-linux-{{ARCH}}.tar.gz'
    preconditions:
      - sh: '[ "{{OS}}" = linux ]'
        msg: package:linux links against GTK and WebKitGTK, so it runs on Linux (see docs/DEVELOPMENT.md for the Docker recipe)
    cmds:
      # A prefix layout: `tar -xzf … -C ~/.local` installs the command, the launcher and the icon.
      - rm -rf "{{.PKG}}"
      - mkdir -p "{{.PKG}}/bin" "{{.PKG}}/share/applications" "{{.PKG}}/share/icons/hicolor/512x512/apps"
      - install -m 755 "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.PKG}}/bin/{{.APP_NAME}}"
      - install -m 644 "build/linux/{{.ID}}.desktop" "{{.PKG}}/share/applications/"
      - install -m 644 build/linux/icon-512.png "{{.PKG}}/share/icons/hicolor/512x512/apps/{{.ID}}.png"
      - tar -C "{{.PKG}}" -czf "{{.ARCHIVE}}" bin share
      - rm -rf "{{.PKG}}"

  bundle:
    internal: true
    cmds:
      - rm -rf "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources"
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS"
      - cp build/darwin/Info.plist "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents"
      - |
        if [ "{{.VERSION}}" != dev ]; then
          plutil -replace CFBundleShortVersionString -string "{{trimPrefix "v" .VERSION}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "{{trimPrefix "v" .VERSION}}" "{{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist"
        fi
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.app"

  dev:frontend:
    summary: Rebuilds the frontend on change and serves it on DEV_PORT
    dir: frontend
    cmds:
      - go run ../cmd/webbuild --watch

  dev:build:
    summary: Development binary (devtools on, frontend from the dev server)
    deps: [bindings]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -buildvcs=false -gcflags=all=-l -o {{.BIN_DIR}}/{{.APP_NAME}}

  dev:run:
    summary: Runs the development binary
    cmds:
      - "{{.BIN_DIR}}/{{.APP_NAME}} {{.CLI_ARGS}}"

  dev:
    summary: Runs Flint with live reload (Go rebuilds on change, the page reloads)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.DEV_PORT}}

  server:
    summary: Runs Flint as an HTTP server for a browser (no window); frontend from dist
    deps: [frontend]
    cmds:
      - go run -tags server . {{.CLI_ARGS}}
